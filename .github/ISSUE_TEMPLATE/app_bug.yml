name: Report a redegpc bug
description: Report a runtime, importer, launcher, controls or save problem in this Linux port.
body:
  - type: markdown
    attributes:
      value: |
        This form is for redegpc, targeting Linux x86_64 and the English iPhone
        release of Resident Evil Degeneration v1.03.00. Reports may be written
        in English or Spanish. Do not attach an IPA or extracted game files.
  - type: input
    id: revision
    attributes:
      label: redegpc revision
      description: Run git rev-parse HEAD in your checkout.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux distribution and architecture
    validations:
      required: true
  - type: input
    id: graphics
    attributes:
      label: GPU, driver and desktop session
      description: Include X11 or Wayland when relevant to graphics or input.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior and observed behavior
      description: Include whether an earlier revision worked, if known.
    validations:
      required: true
  - type: textarea
    id: installation
    attributes:
      label: Game version and installation check
      description: For game-related reports, confirm the version and include the result of make check-game. For build or launcher-only failures, explain whether a game is installed.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs and checks
      description: Include the error and commands you tried. Remove private details and do not paste game data.
      render: text
  - type: checkboxes
    id: piracy-policy
    attributes:
      label: Piracy policy
      options:
        - label: I understand that linking to, discussing or asking for pirated content is not permitted, including abandonware and illegal copies of free applications.
          required: true
