name: Ask a redegpc setup question
description: Ask about building, importing your own supported game or using the launcher.
body:
  - type: markdown
    attributes:
      value: |
        Read the README and launcher installation guide first. Ask in English
        or Spanish. This project does not provide game files or download links.
  - type: textarea
    id: question
    attributes:
      label: Question and what you tried
      description: Include your Linux distribution, redegpc revision and relevant errors.
    validations:
      required: true
  - type: checkboxes
    id: piracy-policy
    attributes:
      label: Piracy policy
      options:
        - label: I understand that linking to, discussing or asking for pirated content is not permitted, including abandonware and illegal copies of free applications.
          required: true
